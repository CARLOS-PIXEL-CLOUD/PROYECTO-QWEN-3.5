name: Agente Qwen 3.6 en la Nube

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  ia-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librería Oficial de Groq
        run: |
          pip install groq

      - name: Ejecutar Cerebro y Agente Qwen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import os
          from groq import Groq

          # Inicialización limpia con el SDK oficial de Groq
          client = Groq(
              api_key=os.environ.get('GROQ_API_KEY').strip()
          )

          # Llamada directa al modelo Qwen 3.6 27B usando la sintaxis nativa de Groq
          completion = client.chat.completions.create(
              model='qwen/qwen3.6-27b', 
              messages=[
                  {'role': 'system', 'content': 'Eres un agente autónomo de IA en la nube. Tu cerebro de razonamiento es Qwen 3.6.'},
                  {'role': 'user', 'content': 'Confirma tu conexión remota exitosa desde GitHub Actions.'}
              ]
          )
          print('\n=== INFORME REMOTO DEL AGENTE QWEN 3.6 ===\n')
          print(completion.choices.message.content)
          "
