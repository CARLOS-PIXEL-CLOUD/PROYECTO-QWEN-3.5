name: Agente de IA en la Nube

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  ia-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Libreria Oficial de Groq
        run: |
          pip install groq

      - name: Ejecutar Servidor con Groq Cloud
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import os
          from groq import Groq

          api_key_clean = os.environ.get('GROQ_API_KEY', '').strip()
          
          if not api_key_clean:
              print('ERROR: La clave GROQ_API_KEY esta vacia.')
              exit(1)

          client = Groq(api_key=api_key_clean)

          completion = client.chat.completions.create(
              model='qwen-2.5-coder-32b', 
              messages=[
                  {'role': 'system', 'content': 'Eres un agente autonomo de IA integrado en GitHub Actions. Tu cerebro es Qwen.'},
                  {'role': 'user', 'content': 'Confirma tu conexion remota exitosa.'}
              ]
          )
          print('\n=== INFORME REMOTO DEL AGENTE QWEN ===\n')
          print(completion.choices.message.content)
          "
