name: Agente de IA en la Nube

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  ia-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librería Oficial de Groq
        run: |
          pip install groq

      - name: Ejecutar Servidor con Groq Cloud
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import os
          from groq import Groq

          api_key_clean = os.environ.get('GROQ_API_KEY', '').strip()
          client = Groq(api_key=api_key_clean)

          # AQUÍ PUEDES CAMBIAR EL MODELO SI LO DESEAS
          completion = client.chat.completions.create(
              model='qwen-2.5-coder-32b', 
              messages=[
                  {'role': 'system', 'content': 'Eres un agente autónomo de IA integrado en GitHub Actions.'},
                  {'role': 'user', 'content': 'Confirma tu conexión remota exitosa e indica qué modelo estás empleando.'}
              ]
          )
          print('\n=== INFORME REMOTO DEL AGENTE ===\n')
          print(completion.choices.message.content)
          "
