name: Agente de IA en la Nube

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  ia-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo del Repositorio
        uses: actions/checkout@v5

      - name: Configurar Entorno de Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalar Libreria Oficial de Groq
        run: |
          pip install groq

      - name: Ejecutar Servidor con Groq Cloud
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import os
          from groq import Groq

          api_key_clean = os.environ.get('GROQ_API_KEY', '').strip()
          
          if not api_key_clean:
              print('ERROR: La clave GROQ_API_KEY esta vacia.')
              exit(1)

          client = Groq(api_key=api_key_clean)
          available_models = {model.id for model in client.models.list().data}
          qwen_models = sorted(model for model in available_models if 'qwen' in model.lower())
          preferred_models = [
              'qwen/qwen3-32b',
              'qwen/qwen3-14b',
              'qwen/qwen3-8b',
          ]
          preferred_model = next(
              (model for model in preferred_models if model in available_models),
              qwen_models[0] if qwen_models else None,
          )
          if preferred_model is None:
              raise RuntimeError(
                  'La clave GROQ_API_KEY no tiene modelos Qwen accesibles. '
                  'Modelos disponibles: ' + ', '.join(sorted(available_models))
              )
          print(f'Modelo Qwen seleccionado: {preferred_model}')

          completion = client.chat.completions.create(
              model=preferred_model,
              messages=[
                  {'role': 'system', 'content': 'Eres un agente autonomo de IA integrado en GitHub Actions. Tu cerebro es Qwen.'},
                  {'role': 'user', 'content': 'Confirma tu conexion remota exitosa.'}
              ]
          )
          print('\n=== INFORME REMOTO DEL AGENTE QWEN ===\n')
          print(completion.choices[0].message.content)
          "
